name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Docs that nothing builds, embeds or tests. Any other path, or a diff that fails, runs everything.
          docs='^(docket/ideas/|docket/order\.md$|docs/|README(\.zh-TW)?\.md$)'
          if files=$(git diff --no-renames --name-only "$BASE" HEAD) &&
             ! printf '%s\n' "$files" | grep -qvE "$docs"; then
            echo code=false >> "$GITHUB_OUTPUT"
          else
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...

  openspec:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: go test ./...
        env:
          DOCKET_TEST_OPENSPEC: npx -y @fission-ai/openspec@1.14.3
          OPENSPEC_TELEMETRY: "0"

  duplicates:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx -y jscpd@5.4.2 --format go --ignore "**/testdata/**,**/*_test.go" --baseline-from-ref origin/main --fail-on-new-clones=0 .

  # Runs on every change: it reads the trailers of each commit, not only files.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go run ./cmd/dkt lint --default-branch main
