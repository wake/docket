name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The oldest Go that go.mod allows, and the current one.
        go: ['1.25.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # TestEarlierHoldsReleases reads the release tags.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        if: matrix.go == 'stable'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  windows:
    # Only the build, the protections, finding programs, the test fakes, the
    # user folders and the paths read from git are verified on Windows; the
    # rest of the suite needs the work in docket/ideas/windows-*.md.
    name: 'windows: build and protections only (dkt is not supported on Windows yet)'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # TestEarlierHoldsReleases reads the release tags.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - shell: bash
        run: |
          go test -v -run 'TestFileAsFolder|TestDomainsChangesIsAFile' ./internal/cli/ 2>&1 | grep -E '^\s*(--- |ok|FAIL|file_as_folder|cmd_domains)' | cut -c1-500 || true
          go test ./internal/missing/ 2>&1 | tail -15 || true

  openspec:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        openspec: ['1.14.0', 'latest']
        # On Windows, npx is npx.cmd: this runs dkt's calls through a batch file.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: TestRealOpenSpec
        run: go test -run TestRealOpenSpec -v ./internal/cli/
        env:
          DOCKET_TEST_OPENSPEC: '1'
          DOCKET_OPENSPEC: npx -y @fission-ai/openspec@${{ matrix.openspec }}

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser reads the history and the tags.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean
      - name: TestInstallSnapshot
        run: go test -run TestInstallSnapshot -v .
        env:
          DOCKET_TEST_DIST: dist
