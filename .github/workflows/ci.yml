name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The oldest Go that go.mod allows, and the current one.
        go: ['1.24.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        if: matrix.go == 'stable'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  openspec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openspec: ['1.14.0', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: TestRealOpenSpec
        run: go test -run TestRealOpenSpec -v ./internal/cli/
        env:
          DOCKET_TEST_OPENSPEC: '1'
          DOCKET_OPENSPEC: npx -y @fission-ai/openspec@${{ matrix.openspec }}
