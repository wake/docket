name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The oldest Go that go.mod allows, and the current one.
        go: ['1.25.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # TestEarlierHoldsReleases reads the release tags.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        if: matrix.go == 'stable'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  windows:
    # Only the build and the protections, and the test fakes they will need,
    # are verified on Windows; the rest of the suite needs the work in
    # docket/ideas/windows-*.md.
    name: 'windows: build and protections only (dkt is not supported on Windows yet)'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go build ./...
      - run: go build ./...
        env:
          GOARCH: arm64
      - run: go vet ./...
      - run: go test ./internal/safefile/ ./internal/safepath/ ./internal/lock/ ./internal/testutil/
      - run: go test -count=5 -v -run TestSnapshotWritesNothing ./internal/snapshot/

  openspec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openspec: ['1.14.0', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: TestRealOpenSpec
        run: go test -run TestRealOpenSpec -v ./internal/cli/
        env:
          DOCKET_TEST_OPENSPEC: '1'
          DOCKET_OPENSPEC: npx -y @fission-ai/openspec@${{ matrix.openspec }}

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser reads the history and the tags.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean
      - name: TestInstallSnapshot
        run: go test -run TestInstallSnapshot -v .
        env:
          DOCKET_TEST_DIST: dist
